version: "3.9"
services:
  powergrid-postgres:
    image: postgres:16-alpine
    container_name: powergrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: powergrid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  powergrid-ml-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: powergrid-ml-api:latest
    container_name: powergrid-ml-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./ml/models:/app/models
      - ./ml/powergrid_material_dataset.csv:/app/powergrid_material_dataset.csv:ro
    environment:
      MODEL_DIR: /app/models
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  powergrid-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: powergrid-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: powergrid-forecasting-api
      ML_API_BASE_URL: http://powergrid-ml-api:5001
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      powergrid-postgres:
        condition: service_healthy
      powergrid-ml-api:
        condition: service_healthy
    networks:
      - app-network

  powergrid-frontend:
    build: ./frontend
    container_name: powergrid-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - powergrid-backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
