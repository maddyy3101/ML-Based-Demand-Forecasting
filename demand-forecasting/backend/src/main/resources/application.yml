spring:
  application:
    name: powergrid-forecasting-api
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

ml:
  api:
    base-url: ${ML_API_BASE_URL:http://127.0.0.1:5001}
    timeout-seconds: 20

jwt:
  secret: "PowerGrid-256bit-JWT-Secret-Change-In-Production-PS25193!"
  expiration-ms: 86400000

file:
  upload-dir: ./uploads

logging:
  level:
    com.powergrid.forecasting: INFO
    org.springframework.web: WARN

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/powergrid
    username: postgres
    password: postgres

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://powergrid-postgres:5432/powergrid
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
